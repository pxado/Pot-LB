worker_processes 1;
pid /run/waytrace-lab-nginx.pid;
error_log /var/log/nginx/waytrace-lab-error.log warn;
events { worker_connections 256; }
http {
  log_format waytrace_safe '$remote_addr - - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "-" "-"';
  access_log /var/log/nginx/access.log waytrace_safe;
  # Railway edge proxy addresses. Use this trust range only inside this Railway lab.
  set_real_ip_from 100.64.0.0/10;
  real_ip_header X-Real-IP;
  real_ip_recursive off;
  server {
    listen 0.0.0.0:8081;
    server_name _;
    client_max_body_size 4k;
    location = /downloads/config.bash { proxy_pass http://127.0.0.1:8080; }
    location / { proxy_pass http://127.0.0.1:3000; }
  }
}
